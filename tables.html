<!doctype html><html lang="en" data-bs-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions | My Finance</title></head><body><div class="wrapper"><aside class="sidebar bg-body-tertiary border-end"><div class="p-3 border-bottom"><a href="../" class="fw-bold text-primary text-decoration-none fs-5">My Finance</a></div><nav class="sidebar-nav p-3"><div class="nav-header">MAIN</div><a class="nav-link" href="../"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a><a class="nav-link active" href="./tables.html"><i class="bi bi-arrow-left-right"></i>Transactions</a><a class="nav-link" href="./tables.html?type=income"><i class="bi bi-arrow-down-circle"></i>Income</a><a class="nav-link" href="./tables.html?type=expense"><i class="bi bi-arrow-up-circle"></i>Expenses</a><a class="nav-link" href="./settings.html"><i class="bi bi-pie-chart"></i>Budgets</a><a class="nav-link" href="./tables.html"><i class="bi bi-bar-chart"></i>Reports</a><div class="nav-header mt-3">ACCOUNT</div><a class="nav-link" href="./profile.html"><i class="bi bi-person"></i>Profile</a><a class="nav-link" href="./settings.html"><i class="bi bi-gear"></i>Settings</a></nav></aside><main class="main-content"><header class="border-bottom p-3 d-flex justify-content-between"><h1 class="h5 mb-0">Transactions</h1><button class="btn btn-outline-secondary btn-sm" data-toggle="theme"><i class="bi bi-moon"></i></button></header><div class="container-fluid p-4"><div class="d-flex justify-content-between mb-3"><div><h2 class="h4">All transactions</h2><p class="text-body-secondary">Income and expenses</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#txModal"><i class="bi bi-plus-lg me-1"></i>Add transaction</button></div><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th class="text-end">Amount</th><th>Account</th><th></th></tr></thead><tbody id="transactionRows"></tbody></table></div></div></div></main></div><div class="modal fade" id="txModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="transactionForm"><div class="modal-header"><h5 class="modal-title">Add transaction</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3"><label class="form-label">Description</label><input name="description" class="form-control" required></div><div class="row g-3"><div class="col-6"><label class="form-label">Type</label><select name="type" class="form-select"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="col-6"><label class="form-label">Amount (฿)</label><input name="amount" type="number" min="0" step="0.01" class="form-control" required></div><div class="col-6"><label class="form-label">Category</label><input name="category" class="form-control" placeholder="Food"></div><div class="col-6"><label class="form-label">Account</label><input name="account" class="form-control" placeholder="Bank / Card"></div><div class="col-12"><label class="form-label">Date</label><input name="date" type="date" class="form-control" required></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save transaction</button></div></form></div></div><script type="module" src="../js/main.js"></script></body></html>
